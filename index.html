<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VS-ZKB Code Studio</title>
  <meta name="google-site-verification" content="F-g7DT6ESPqMzhtAy-BOztgyEqMCa0ZXrVn30-FO8do" />
  <meta name="description" content="Free online code editor and runner. Write and run Python, HTML, CSS and JavaScript in your browser.">
  <link rel="stylesheet" href="./static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
</head>
<body>
<div class="app-shell">

  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="./static/zikim-logo.png" alt="Zikim Logo">
      <span>VS-ZKB <b>Code Studio</b></span>
    </div>
    <div class="top-actions">
      <span class="save-status" id="saveStatus">Saved locally</span>
      <button class="btn" id="settingsBtn" type="button">⚙ Settings</button>
      <button class="btn" id="downloadBtn" type="button">Download file</button>
      <button class="btn primary" id="runBtn" type="button"><span>▶</span> Run</button>
    </div>
    <div id="settingsMenu" class="settings-menu hidden">
      <div class="settings-title">SETTINGS</div>
      <button type="button" id="setExp">Hide Explorer</button>
      <button type="button" id="setPanel">Hide Terminal</button>
      <button type="button" id="setTheme">Switch to Light Mode</button>
    </div>
  </header>

  <!-- File explorer (top) -->
  <nav id="explorer" class="explorer">
    <div id="fileTree" class="file-tree"></div>
    <button id="addBtn" class="add-btn" type="button" title="New file">+</button>
    <form id="addForm" class="add-form hidden">
      <input id="newName" placeholder="file name" autocomplete="off" spellcheck="false">
      <select id="newExt">
        <option>.py</option><option>.html</option><option>.css</option><option>.js</option>
        <option>.json</option><option>.c</option><option>.cpp</option><option>.java</option>
        <option>.md</option><option>.txt</option>
      </select>
      <button class="btn primary" type="submit">Save</button>
      <button class="btn" type="button" id="cancelAdd">Cancel</button>
    </form>
  </nav>

  <main class="main">
    <div id="editor" class="editor"></div>
    <div id="fallbackEditor" class="fallback hidden">
      <textarea id="plainEditor" spellcheck="false" aria-label="Code editor"></textarea>
    </div>

    <section id="panel" class="panel">
      <div class="panel-head">
        <div class="panel-tabs">
          <button class="panel-tab active" data-panel="term">TERMINAL</button>
          <button class="panel-tab" data-panel="problems">PROBLEMS <span id="probCount" class="badge">0</span></button>
          <button class="panel-tab" data-panel="output">OUTPUT</button>
        </div>
        <div class="panel-actions">
          <button id="clearBtn" type="button">Clear</button>
          <button id="hidePanelBtn" type="button" title="Hide terminal">⌄</button>
        </div>
      </div>
      <div id="termView" class="view">
        <div id="termOut" class="term-out"><div class="dim">▶ Run your code to see output here.</div></div>
      </div>
      <div id="problemsView" class="view hidden"></div>
      <div id="outputView" class="view hidden"><iframe id="outFrame" title="Output preview" sandbox="allow-scripts"></iframe></div>
    </section>

    <div class="ad-slot"><span class="ad-label">ADVERTISEMENT</span><span class="ad-placeholder">Ad space</span></div>

    <footer class="statusbar">
      <span id="langStatus">python</span>
      <span id="cursorStatus">Ln 1, Col 1</span>
      <span>UTF-8</span>
      <span><a href="about.html">About</a> · <a href="contact.html">Contact</a> · <a href="privacy.html">Privacy</a></span>
    </footer>
  </main>
</div>


<script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
<script src="./static/app.js"></script>
</body>
</html>
